name: Responsividade UI local

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Playwright estavel corrente isolado
        run: | # zizmor: ignore[adhoc-packages] Playwright deve ser latest estavel para a suite.
          npm install --prefix "$RUNNER_TEMP/nebula-ui" --no-save --ignore-scripts --no-audit --no-fund playwright@latest
          node "$RUNNER_TEMP/nebula-ui/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Avaliar telas ate 4K sem servicos externos
        run: |
          NODE_PATH="$RUNNER_TEMP/nebula-ui/node_modules" node tests/responsividade.cjs
